[project]
name = "hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "hamza99ayman250@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "gitpython>=3.1.62",
    "google-genai>=2.22.0",
    "openai>=3.13.0",
    "python-dotenv>=1.2.3",
    "radon>=6.0.1",
    "tenacity>=8.2.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
hackathon = "hackathon:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
